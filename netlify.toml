[build]
  command = "NODE_OPTIONS='--max-old-space-size=4096' npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Externalize heavy server-only deps from the Next.js Lambda handler so the
# function upload stays under Netlify's size limit. Netlify's plugin uses
# esbuild under the hood; external_node_modules tells it to require() these
# at runtime instead of inlining them.
[functions]
  included_files = ["app/lib/generated/**"]
  external_node_modules = [
    "@googleapis/sheets",
    "@googleapis/drive",
    "@googleapis/gmail",
    "google-auth-library",
    "googleapis-common",
    "gaxios",
    "gtoken",
    "@sentry/nextjs",
    "@sentry/node",
    "@opentelemetry/api",
    "@opentelemetry/instrumentation",
    "xlsx",
  ]

# W7: nightly stale-deal sweep — 8am Mexico City (UTC-6) = 14:00 UTC
# Schedule also declared in netlify/functions/stale-deal-sweep.ts; this
# block is the canonical source for Netlify's scheduler.
[functions."stale-deal-sweep"]
  schedule = "0 14 * * *"

# Cut #3: hourly Odoo→Sheets mirror sync. Pulls deltas (rows whose
# write_date is newer than what's in the mirror) for invoices, payments,
# and sale orders. Spot refresh in app/lib/odoo/write.ts handles immediate
# post-write freshness; this catches changes Roger makes directly in Odoo.
[functions."odoo-sync"]
  schedule = "0 * * * *"

# Currency awareness: pull today's USD→MXN rate from Frankfurter (ECB-
# sourced, free, no token). Daily at 17:00 UTC — after ECB publishes
# around 16:00 CET on weekdays. Falls back gracefully when the source
# is offline (page just hides the equivalent display).
[functions."fx-sync"]
  schedule = "0 17 * * *"

# Non-localed public paths redirect to the default locale (en).
# Complements the middleware short-circuit so requests arriving without
# a locale prefix still resolve to a valid route.
[[redirects]]
  from = "/shop/*"
  to = "/en/shop/:splat"
  status = 302

[[redirects]]
  from = "/brands/*"
  to = "/en/brands/:splat"
  status = 302

[[redirects]]
  from = "/insights/*"
  to = "/en/insights/:splat"
  status = 302
